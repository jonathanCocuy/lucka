name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Two quick merges never publish in parallel.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      exists: ${{ steps.read.outputs.exists }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🏷️ Read version
        id: read
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag already exists. Nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # Draft: `releases/latest` doesn't see it until every file is uploaded.
  create:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}

    steps:
      - name: 📝 Create draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            -f name="Lucka $TAG" -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [version, create]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            fixed-name: Lucka-macos.dmg
          - os: windows-latest
            args: ''
            rust-targets: ''
            bundle: src-tauri/target/release/bundle/nsis/*-setup.exe
            fixed-name: Lucka-windows-setup.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: 💾 Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 📦 Install
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create.outputs.id }}
          args: ${{ matrix.args }}

      # Fixed name: the landing links to releases/latest/download/<name>.
      - name: 🔗 Upload with a fixed name
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cp ${{ matrix.bundle }} "${{ matrix.fixed-name }}"
          gh release upload "$TAG" "${{ matrix.fixed-name }}" --clobber

  publish:
    needs: [version, create, build]
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create.outputs.id }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true
