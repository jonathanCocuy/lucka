name: CI

on:
  pull_request:
    branches: [feedback, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Valores falsos: el build solo necesita que existan.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📦 Install
        run: pnpm install --frozen-lockfile

      - name: 📏 Lint
        run: pnpm lint

      - name: 🎨 Prettier
        run: pnpm format:check

      - name: 🔎 Types
        run: pnpm typecheck

      - name: 🧪 Tests
        run: pnpm test

      - name: 🏗️ Build
        run: pnpm build
