name: Build check

# El build real de macOS y Windows, sin publicar. Atrapa en el PR lo que
# antes solo fallaba al mergear (librerías nativas, firma, empaquetado).
on:
  pull_request:
    branches: [feedback, staging, main]
    paths:
      - 'src-tauri/**'
      - 'scripts/**'
      - '.cargo/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-check.yml'
      - '.github/workflows/release.yml'

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: 💾 Cache de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 📦 Install
        run: pnpm install --frozen-lockfile

      # Sin artefactos del updater: no hace falta la llave de firma en el PR.
      - name: 🏗️ Build
        shell: bash
        run: >
          pnpm tauri build ${{ matrix.args }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # Abrir la app atrapa librerías que faltan o que macOS rechaza (firma).
      - name: 🍎 Firma y arranque
        if: runner.os == 'macOS'
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Lucka.app
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/lucka" &
          sleep 15
          if ! kill -0 $! 2>/dev/null; then
            echo "La app se cerró al arrancar"
            exit 1
          fi
          kill $!

      - name: 🪟 Instalar y arrancar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter lucka.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'No se encontró lucka.exe instalado' }
          $proc = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) { throw "La app se cerró al arrancar (código $($proc.ExitCode))" }
          Stop-Process $proc
