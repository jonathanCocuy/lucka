<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source of every app icon: pnpm tauri icon src-tauri/icons/source.svg -->
  <!-- Two coins, for "lucas" (Bogotá slang for money). Full-bleed tile, matching the landing favicon. -->
  <rect width="1024" height="1024" rx="232" fill="#7c6cf2"/>
  <circle cx="612" cy="412" r="232" fill="#3ddbb4"/>
  <circle cx="612" cy="412" r="176" fill="none" stroke="#17a683" stroke-opacity="0.35" stroke-width="20"/>
  <!-- The tile-colored stroke opens the gap between the coins. -->
  <circle cx="420" cy="604" r="266" fill="#ffffff" stroke="#7c6cf2" stroke-width="28"/>
  <circle cx="420" cy="604" r="192" fill="none" stroke="#7c6cf2" stroke-opacity="0.22" stroke-width="22"/>
</svg>
