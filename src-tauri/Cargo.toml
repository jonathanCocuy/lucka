[package]
name = "lucka"
version = "0.5.0"
description = "Tus finanzas, en tu computador"
authors = ["Juan Ramirez"]
license = "MIT"
repository = "https://github.com/juan-ramirez-dev/lucka"
edition = "2024"
rust-version = "1.90"

[lib]
# Nombre distinto al binario: evita choque de nombres en Windows.
name = "lucka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
# Local voice: microphone, speech→text (whisper.cpp) and text→JSON (llama.cpp).
cpal = "0.18.2"
whisper-rs = "0.16.0"
# No openmp: Apple's clang doesn't ship it.
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common", "dynamic-link"] }
sha2 = "0.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
tokio = { version = "1.53.3", features = ["fs", "io-util", "time"] }
futures-util = "0.3.34"
keyring = "4.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common", "metal", "dynamic-link"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
