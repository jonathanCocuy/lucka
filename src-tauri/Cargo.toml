[package]
name = "lucka"
version = "0.2.0"
description = "Tus finanzas, en tu computador"
authors = ["Juan Ramirez"]
license = "MIT"
repository = "https://github.com/juan-ramirez-dev/lucka"
edition = "2024"
rust-version = "1.90"

[lib]
# Nombre distinto al binario: evita choque de nombres en Windows.
name = "lucka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
